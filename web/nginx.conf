server { 
  # DELIBERATE BREAKAGE (#70): the next line is not an nginx directive, so the container exits at start and the deploy gate must roll web back. Reverted right after the proof.
  deliberately_invalid_directive_for_rollback_proof on;
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location = /health {proxy_pass http://api:3000/health;}   
  location /api/ {proxy_pass http://api:3000;}   
location / {try_files $uri /index.html;}}
