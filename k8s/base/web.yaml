# The browser client: the React build served by Nginx (web/Dockerfile), two
# replicas behind a Service; the Gateway sends `/` here (ARCHITECTURE D27).
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: http # by name (INF-10)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # two pods serve the page throughout a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app: web
    spec:
      # nginx/nginx-unprivileged runs as uid 101 and listens on 8080; the
      # numeric user lets the kubelet check runAsNonRoot (SEC-6, D27)
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      # No ConfigMap or Secret: the page holds nothing private (SEC-2)
      containers:
        - name: web
          # `unpinned` is not a real tag: CI pins the commit SHA on merge
          # (deploy.yml) and the minikube overlay uses the local build (INF-9)
          image: ghcr.io/nabeegh-khan/contentcollab-web:unpinned
          ports:
            - name: http
              containerPort: 8080 # `listen 8080` in web/nginx.conf
          # Ready once Nginx serves the page itself; `/health` in nginx.conf
          # is proxied to the API, so it would test the wrong thing
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
