# The shape of the one Secret the stack needs. This file holds placeholders only.
#
# Real values never go into Git or an image (SEC-1). Base64 is an encoding, not
# encryption: anyone who can `get secrets` in the namespace reads every value
# (SEC-10), and so does anyone who reads the YAML a value was applied from.
#
# Make the real object with scripts/app-secret.sh. It takes the values from the
# environment or a prompt and applies them over stdin by server-side apply.
# Do not `kubectl apply -f` a filled-in copy of this file: client-side apply keeps
# every value in plain text in the last-applied-configuration annotation.
#
# Who reads what (SEC-2): api and worker take every key through envFrom; postgres
# reads DB_USER and DB_PASSWORD by key; nothing else is given any of them.
# scripts/secret-template.test.mjs fails the pull request if that changes.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: contentcollab
type: Opaque
stringData:
  DB_USER: REPLACE_ME       # any name; postgres creates the account on its first start
  DB_PASSWORD: REPLACE_ME   # postgres reads it only when it first initialises its volume: do not change it later
  JWT_SECRET: REPLACE_ME    # signs the login tokens; changing it logs everyone out
  SPACES_KEY: REPLACE_ME    # access key of the Spaces key `contentcollab-app` (k8s/README.md)
  SPACES_SECRET: REPLACE_ME # its secret half, shown once when the key is created
