# The shape of the one Secret the stack needs. Copy to secrets.yaml (ignored),
# fill in real values and `kubectl apply -f` it once. Never commit the copy.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: contentcollab
type: Opaque
stringData:
  DB_USER: user
  DB_PASSWORD: change-me
  JWT_SECRET: change-me
  SPACES_KEY: ""
  SPACES_SECRET: ""
