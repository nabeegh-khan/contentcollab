# The JSON API: replicated, autoscaled, and only given traffic once /health
# says Postgres and Redis answer (INF-4, API-8).
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # always at least two pods during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
    spec:
      # Longer than any request, so SIGTERM lets in-flight work finish (API-7)
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the `node` user in the image (SEC-6)
      containers:
        - name: api
          # The tag is replaced by the overlay (minikube: local build) or by
          # CI on merge (doks: the commit SHA), never edited here (INF-5)
          image: ghcr.io/nabeegh-khan/contentcollab-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          # Readiness gates traffic and asks about Postgres and Redis through
          # /health. Liveness only asks whether the process still accepts
          # connections: a dependency being down must not get the API killed
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
# Scales the API between 2 and 5 pods on average CPU (planned feature 4)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Node drains and upgrades keep at least one API pod serving
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
