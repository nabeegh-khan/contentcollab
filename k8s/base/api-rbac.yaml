# The API's own ServiceAccount and what it may read in the cluster. api-status: its own Deployment's
# ready replicas for GET /api/v1/status (#30, ARCHITECTURE D23). api-ops, contentcollab-api-nodes and contentcollab-api-volumes:
# the read-only operations panel (D31). The one write, evicting a pod for the restart drill, is its own
# file, api-drill-rbac.yaml. Least privilege (SEC-6, lecture 8 on RBAC).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-status
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["api"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-status
subjects:
  - kind: ServiceAccount
    name: api
    namespace: contentcollab
---
# The operations panel (D31, GET /api/v1/ops): read-only. Pods and their logs cannot be narrowed by name
# (their names change on every rollout, and RBAC has no label selector), so the API's code decides which
# pods it reads; the HPA, the one claim and the backup CronJob are named. No verb but get and list, no
# Secrets, no exec. D35 adds the Deployments and StatefulSets (desired copies per part) and the Jobs (the
# newest backup run): a list cannot be narrowed to a name without a field selector (Kubernetes RBAC docs,
# checked 24 Nov 2026) and a Job's name carries a timestamp, so those two are namespace-wide lists.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-ops
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    resourceNames: ["api"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: ["data-postgres-0"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["db-backup"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-ops
subjects:
  - kind: ServiceAccount
    name: api
    namespace: contentcollab
---
# Nodes are cluster-scoped, so a Role cannot grant them: the first and only cluster-wide objects here
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: contentcollab-api-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: contentcollab-api-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: contentcollab-api-nodes
subjects:
  - kind: ServiceAccount
    name: api
    namespace: contentcollab
---
# PersistentVolumes are cluster-scoped, so a Role cannot grant them (D35). `get` only, with no list: the API
# reads the one volume its own claim names, for the reclaim policy shown on the Storage card. A role of its
# own, so removing it switches only that line off.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: contentcollab-api-volumes
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: contentcollab-api-volumes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: contentcollab-api-volumes
subjects:
  - kind: ServiceAccount
    name: api
    namespace: contentcollab
