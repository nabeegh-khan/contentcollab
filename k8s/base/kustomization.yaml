apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything runs in its own namespace so `kubectl delete ns` removes it all.
namespace: contentcollab

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml

# The Secret is not in this list on purpose: it is created from
# secrets.example.yaml with real values, once, by hand (SEC-1).
