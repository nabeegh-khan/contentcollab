# PostgreSQL as a StatefulSet: one replica, a stable name, and a volume claim
# that outlives the pod (DB-2). Deleting the pod re-attaches the same volume.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None # headless: the pod gets a stable DNS name
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
          # Same mount as compose.yaml: postgres:18 keeps its data directory
          # under this path, so the whole tree lives on the claim
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          # Same checks as compose.yaml: ready once connections are accepted
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "contentcollab"]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "contentcollab"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  # One claim per replica; the storage class comes from the overlay
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
