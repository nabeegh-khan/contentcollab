# Laptop settings: one replica, local image, and a NodePort so
# `minikube service api -n contentcollab` opens it without a Gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: Never
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
