# Datadog agent on the cluster (#27): container logs, Kubernetes metrics and
# the API's /metrics, into the dashboards used in the presentation.
# Installed by scripts/cluster-up.sh step 6, which checks the key, creates the
# namespace and the Secret, then runs helm with the chart version pinned there.
# The API key never enters the repo: scripts/cluster-up.sh creates the
# `datadog-secret` Secret from DATADOG_API_KEY in the environment (SEC-1).
datadog:
  apiKeyExistingSecret: datadog-secret
  clusterName: contentcollab
  # site: set by scripts/cluster-up.sh from DATADOG_SITE (default datadoghq.com)
  # Container logs from every pod, kept after the pod is gone (OBS-1, OBS-2)
  logs:
    enabled: true
    containerCollectAll: true
  # Kubernetes state metrics: pod restarts, pending pods, HPA replica counts (OBS-3)
  kubeStateMetricsCore:
    enabled: true
  # kubelet.tlsVerify stays at the chart default (true). No DigitalOcean or
  # Datadog source says DOKS needs it off; turn it off only if `agent status`
  # in a datadog-agent pod shows an x509 error reaching the kubelet.
# One agent per node; the small nodes need the agent kept light (OBS-5)
agents:
  containers:
    agent:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 300m
          memory: 512Mi
