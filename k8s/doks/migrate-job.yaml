# Runs api/migrations against the cluster's PostgreSQL before each rollout
# (ARCHITECTURE D20, #117, #37). Applied only by deploy.yml's migrate step,
# which replaces __IMAGE_TAG__ with the commit SHA; it is not in the doks
# overlay, so `kubectl apply -k k8s/doks` never creates it.
apiVersion: batch/v1
kind: Job
metadata:
  # One Job per commit: a Job's pod template cannot change after creation,
  # and the SHA ties each log to its deploy. deploy.yml deletes a Job of the
  # same name first, so re-running a commit's deploy works
  name: db-migrate-__IMAGE_TAG__
  namespace: contentcollab
  labels:
    app: db-migrate
spec:
  # A failed migration is read from its log, not retried blindly (D20)
  backoffLimit: 0
  activeDeadlineSeconds: 120
  # The finished Job and its log stay a day, then Kubernetes removes them
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the `node` user in the API image (SEC-6)
      containers:
        - name: migrate
          image: ghcr.io/nabeegh-khan/contentcollab-api:__IMAGE_TAG__
          command: ["npm", "run", "migrate", "--", "up"]
          # node-pg-migrate uses the PG* variables when DATABASE_URL is not
          # set (bin/node-pg-migrate.js 9.0.0, line 349). Only the five
          # database values, not the whole Secret (SEC-2)
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
