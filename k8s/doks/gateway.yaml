# Traffic entry (D11): one Gateway terminates TLS, HTTPRoutes send /api and
# /socket.io to the API, and the `web` route sends everything else to the
# browser client (D26).
# Needs the Gateway API CRDs, a controller and cert-manager installed first
# (scripts/cluster-up.sh, stage 3).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: contentcollab
  annotations:
    # cert-manager issues contentcollab-tls for the hostname below
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: nginx
  listeners:
    # Port 80 exists for the Let's Encrypt HTTP-01 challenge only
    - name: http
      protocol: HTTP
      port: 80
      hostname: contentcollab.app
    - name: https
      protocol: HTTPS
      port: 443
      hostname: contentcollab.app
      tls:
        mode: Terminate
        certificateRefs:
          - name: contentcollab-tls # issued by cert-manager
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - name: contentcollab
  hostnames: ["contentcollab.app"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /socket.io
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: api
          port: 3000
---
# Everything the api route does not take goes to the browser client. Gateway
# API prefers an exact match, then the longest prefix, across routes, so
# /api, /socket.io and /health above still reach the API (D26). HTTPS
# listener only, so the sign-in form is never served over plain HTTP
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - name: contentcollab
      sectionName: https
  hostnames: ["contentcollab.app"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
