# Traffic entry (D11): one Gateway terminates TLS, HTTPRoutes send /api and
# /socket.io to the API, and the `web` route sends everything else to the
# browser client (D27).
# Needs the Gateway API CRDs, a controller and cert-manager installed first
# (scripts/cluster-up.sh, stage 3).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: contentcollab
  annotations:
    # cert-manager issues contentcollab-tls for the hostname below
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: nginx
  listeners:
    # Port 80 exists for the Let's Encrypt HTTP-01 challenge only
    - name: http
      protocol: HTTP
      port: 80
      hostname: contentcollab.app
    - name: https
      protocol: HTTPS
      port: 443
      hostname: contentcollab.app
      tls:
        mode: Terminate
        certificateRefs:
          - name: contentcollab-tls # issued by cert-manager
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - name: contentcollab
  hostnames: ["contentcollab.app"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /socket.io
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: api
          port: 3000
---
# Everything the api route does not take goes to the browser client. Gateway
# API prefers an exact match, then the longest prefix, across routes, so
# /api, /socket.io and /health above still reach the API (D27). HTTPS
# listener only, so the sign-in form is never served over plain HTTP
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - name: contentcollab
      sectionName: https
  hostnames: ["contentcollab.app"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
---
# Grafana for the operations panel's link (#161, D31). The path prefix is stripped before the request
# reaches Grafana (urlRewrite, supported by NGF: Gateway API compatibility page, checked 22 Nov 2026), and
# Grafana's root_url carries the prefix for its own links. HTTPS only, so the Grafana login is never served
# over plain HTTP. The backend lives in another namespace: referencegrant.yaml there allows it. Longer
# prefix than the web route's "/", so this wins for /grafana.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: contentcollab
      sectionName: https
  hostnames: ["contentcollab.app"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: grafana
          namespace: observability
          port: 3000
---
# Uploads: NGF applies nginx's client_max_body_size (1 MiB unless set), so a normal PDF would get a
# 413 at the Gateway before reaching the API, whose own limit is 50 MiB (D29). maxSize "0" would switch
# the check off, so it is a number (NGF API reference, ClientBody.maxSize; checked 21 Nov 2026).
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: contentcollab-client-settings
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: contentcollab
  body:
    maxSize: 50m
