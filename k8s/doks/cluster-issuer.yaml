# Let's Encrypt through cert-manager; the HTTP-01 challenge is served through
# our Gateway, so no Ingress is needed. LETSENCRYPT_EMAIL is filled in by
# scripts/cluster-up.sh; the address receives expiry warnings only.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: LETSENCRYPT_EMAIL
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: contentcollab
                namespace: contentcollab
                kind: Gateway
