# A rendered overlay that breaks one row each, for scripts/check-manifests.test.sh
apiVersion: v1
kind: Service
metadata:
  name: orphan
spec:
  selector:
    app: nobody
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken
spec:
  selector:
    matchLabels:
      app: broken
  template:
    metadata:
      labels:
        app: different
    spec:
      containers:
        - name: broken
          image: nginx
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floating
spec:
  selector:
    matchLabels:
      app: floating
  template:
    metadata:
      labels:
        app: floating
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: floating
          image: redis:latest
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
