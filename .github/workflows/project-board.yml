name: Project board

# Keeps the board's Status column in step with what happens on issues and pull
# requests, so nobody moves cards by hand:
#   issue assigned            -> Ready
#   issue has no assignee     -> Backlog
#   PR opened with "Closes #n" -> In progress for each #n
#   PR review requested        -> In review for each #n
# GitHub's own board workflows already put new items in Backlog and closed ones in Done.
# Needs the repository secret PROJECT_TOKEN: a personal access token of the board owner
# with the "project" and "repo" scopes (the default GITHUB_TOKEN cannot see user projects).

on:
  issues:
    types: [assigned, unassigned]
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested]

permissions:
  contents: read

env:
  OWNER: nabeegh-khan
  PROJECT_NUMBER: 2

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Decide the column and the issues to move
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE: ${{ github.event.issue.number }}
          ASSIGNEES: ${{ toJson(github.event.issue.assignees) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = issues ]; then
            if [ "$(echo "$ASSIGNEES" | jq length)" -gt 0 ]; then status=Ready; else status=Backlog; fi
            issues="$ISSUE"
          else
            case "$ACTION" in
              review_requested) status="In review" ;;
              *) status="In progress" ;;
            esac
            # Every "Closes #n", "Fixes #n" or "Resolves #n" in the PR description.
            issues=$(printf '%s' "$PR_BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -u | tr '\n' ' ')
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "issues=$issues" >> "$GITHUB_OUTPUT"

      - name: Move the cards
        if: steps.plan.outputs.issues != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          STATUS: ${{ steps.plan.outputs.status }}
          ISSUES: ${{ steps.plan.outputs.issues }}
        run: |
          project_id=$(gh project view "$PROJECT_NUMBER" --owner "$OWNER" --format json --jq .id)
          field=$(gh project field-list "$PROJECT_NUMBER" --owner "$OWNER" --format json --jq '.fields[] | select(.name == "Status")')
          field_id=$(printf '%s' "$field" | jq -r .id)
          option_id=$(printf '%s' "$field" | jq -r --arg s "$STATUS" '.options[] | select(.name == $s) | .id')
          items=$(gh project item-list "$PROJECT_NUMBER" --owner "$OWNER" --format json --limit 500)
          for n in $ISSUES; do
            item_id=$(printf '%s' "$items" | jq -r --argjson n "$n" '.items[] | select(.content.number == $n) | .id')
            if [ -z "$item_id" ]; then echo "#$n is not on the board"; continue; fi
            gh project item-edit --project-id "$project_id" --id "$item_id" --field-id "$field_id" --single-select-option-id "$option_id"
            echo "#$n -> $STATUS"
          done
