# Runs on every pull request to main, so broken code is caught before review
name: ci

on:
  pull_request:
    branches: [main]
  # deploy.yml calls these same checks on main before it builds anything
  workflow_call:

jobs:
  api:
    runs-on: ubuntu-latest # fresh Linux machine from GitHub for each run
    defaults:
      run:
        working-directory: api # every command below runs inside api/
    steps:
      - uses: actions/checkout@v5 # pulls the branch's code onto the machine
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # same Node as the Dockerfile, so CI matches the container
          cache: npm # reuses downloaded packages between runs, faster installs
          cache-dependency-path: api/package-lock.json # cache key changes when the lockfile does
      - run: npm ci # exact versions from the lockfile, fails if it is out of step
      - run: npm run lint # ESLint: catches bugs and unsafe patterns
      - run: npm run format:check # Prettier: fails if any file is not formatted
      - run: npm run typecheck # tsc: fails on type errors without building

  # Jest and Supertest against a real PostgreSQL and Redis (#38). Every
  # endpoint adds its tests next to its route file and they run here on
  # every pull request, so a change that breaks another member's part fails
  # before review.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18 # same version as compose.yaml
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: contentcollab_test
        ports: ["5432:5432"]
        # wait until the database accepts connections before the steps run
        options: >-
          --health-cmd "pg_isready -U test -d contentcollab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8
        ports: ["6379:6379"]
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: contentcollab_test
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # The migrations must survive up, down, up against this Postgres before
      # any test runs, and the schema is left migrated for the tests (DB-9,
      # TST-1). Skipped until api/migrations exists (#37).
      - name: Migrations up, down, up
        run: bash ../scripts/ci-migrate-check.sh
        env:
          PGHOST: ${{ env.DB_HOST }} # node-pg-migrate reads the PG* variables
          PGPORT: ${{ env.DB_PORT }}
          PGUSER: ${{ env.DB_USER }}
          PGPASSWORD: ${{ env.DB_PASSWORD }}
          PGDATABASE: ${{ env.DB_NAME }}
      - run: npm test

  # Renders both overlays and checks every object against the Kubernetes
  # schemas, so a bad manifest fails the PR instead of the cluster
  k8s:
    runs-on: ubuntu-latest
    env:
      # The Kubernetes versions every manifest is validated against, set once:
      # 1.36, the plan in ARCHITECTURE D13 (maintained until 28 Jun 2027), and
      # 1.37, which the cluster rebuilt on 11 Nov 2026 runs (D13). 1.33 reached
      # end of life on 28 Jun 2026 (kubernetes.io/releases, checked 11 Nov 2026)
      KUBE_VERSION: "1.36.0 1.37.0"
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-kubectl@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render and validate
        run: |
          for overlay in minikube doks; do
            kubectl kustomize k8s/$overlay > /tmp/$overlay.yaml
            bash scripts/ci-kubeconform.sh /tmp/$overlay.yaml
          done
          # The issuer is applied by scripts/cluster-up.sh, not by the overlay
          bash scripts/ci-kubeconform.sh k8s/doks/cluster-issuer.yaml
      - name: Infra overlay and migrate Job
        # Rendered and validated once #37 adds them; skipped until then
        run: bash scripts/ci-k8s-cloud.sh
      - name: API replicas spread across nodes
        # Two replicas on two nodes are only highly available if the
        # scheduler is told to spread them: its default spread skips nodes
        # without a zone label, which DOKS nodes lack (ARCHITECTURE D5, #69).
        # yq 4 is preinstalled on the runner.
        run: |
          for overlay in minikube doks; do
            ok=$(yq 'select(.kind == "Deployment" and .metadata.name == "api") | (.spec.template.spec.topologySpreadConstraints // []) | map(select(.topologyKey == "kubernetes.io/hostname" and .maxSkew == 1 and .whenUnsatisfiable == "ScheduleAnyway" and .labelSelector.matchLabels.app == "api" and ((.matchLabelKeys // []) | contains(["pod-template-hash"])))) | length > 0' /tmp/$overlay.yaml)
            [ "$ok" = "true" ] || { echo "::error::$overlay: api Deployment has no kubernetes.io/hostname spread constraint (maxSkew 1, ScheduleAnyway, app=api, pod-template-hash); got '$ok'"; exit 1; }
          done
      - name: Deploy path checks
        # Image pinning, rollback on a failed rollout and the named API port
        # (tests/test_k8s_deploy.py). Uses the runner's python3 and its PyYAML,
        # which the image readme does not list: it imported on ubuntu-26.04
        # 20261101.186.1 (run 42533543112, 8 Nov 2026); if an image drops it,
        # this step fails with ModuleNotFoundError rather than passing
        run: python3 -m unittest tests.test_k8s_deploy -v
      - name: Every object in the app namespace
        # A namespace set in the base does not reach resources an overlay
        # adds; the Gateway once landed in `default` this way (BUILD_LOG.md,
        # 4 Nov). yq 4 is preinstalled on the Ubuntu runner.
        run: |
          for overlay in minikube doks infra migrate-job; do
            [ -f /tmp/$overlay.yaml ] || continue # infra and migrate-job exist once #37 lands
            # yq writes to a file so a yq failure stops the step; in a pipe with `|| true` it read as no strays
            yq 'select(.kind != "Namespace" and .metadata.namespace != "contentcollab") | .kind + "/" + .metadata.name' /tmp/$overlay.yaml > /tmp/$overlay.stray
            stray=$(grep -v '^---$' /tmp/$overlay.stray || true)
            [ -z "$stray" ] || { echo "::error::$overlay renders objects outside contentcollab: $stray"; exit 1; }
          done

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Unit tests of the job handlers on fixture files (no Redis needed),
      # Node's built-in runner through tsx (#23, D21)
      - run: npm test

  # Node's built-in test runner over the operational scripts (no
  # dependencies), e.g. the HPA readiness check the load test relies on (#69)
  scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read # reads the repo, writes nothing
    timeout-minutes: 5 # the suite takes under a second; a hang fails fast
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/*.test.mjs

  # Builds the API image exactly as the deploy workflow will, without pushing it,
  # so a Dockerfile that no longer builds fails the pull request rather than
  # the first deploy. The image is built in a container (same base image as
  # the Dockerfile pins), and layers are cached between runs through GitHub's
  # cache so a source-only change rebuilds in seconds (L4 p47-48).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a hung build or smoke loop fails fast instead of running for hours
    services:
      redis: # the smoke run checks /health reports Redis ok
        image: redis:8
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3 # BuildKit builder, needed for the cache options below
      - uses: docker/build-push-action@v6
        with:
          context: api # the Dockerfile and its files live in api/
          push: false # build only; deploy.yml pushes on merge to main
          load: true # copy the result into the runner's Docker daemon so `docker run` below can find it
          tags: contentcollab-api:pr # local tag, never published
          cache-from: type=gha # reuse layers from earlier runs
          cache-to: type=gha,mode=max # save every layer for the next run
      - name: Smoke the image
        # Start the container on the runner's network so it reaches the Redis
        # service above on localhost, and confirm the process answers with
        # Redis ok. With no Postgres /health is 503 degraded, which is the
        # correct status here, so the body is what is checked (TST-3).
        run: |
          docker run -d --name api --network host -e PORT=3000 -e REDIS_HOST=127.0.0.1 contentcollab-api:pr
          for _ in $(seq 1 20); do
            body=$(curl -s -m 3 http://localhost:3000/health || true)
            case "$body" in *'"redis":"ok"'*) echo "answered: $body"; exit 0 ;; esac
            sleep 1
          done
          echo "api did not report Redis ok on 3000 (last: $body)"; docker logs api; exit 1
      - name: Starts without Redis, then picks it up (#65)
        # Points the image at a Redis that does not exist yet: the process must
        # still listen and say Redis is down within 1 s (the readiness probe's
        # default timeout), not crash or hang, so Kubernetes never
        # restart-loops a pod over a dependency outage. Then Redis starts on
        # that port and the same process must report it ok, without a restart.
        run: |
          docker run -d --name api-noredis --network host -e PORT=3002 -e REDIS_HOST=127.0.0.1 -e REDIS_PORT=6399 contentcollab-api:pr
          down=""
          for _ in $(seq 1 20); do
            body=$(curl -s -m 1 http://localhost:3002/health || true)
            case "$body" in *'"redis":"down"'*) down=yes; echo "listening without Redis: $body"; break ;; esac
            sleep 1
          done
          if [ -z "$down" ]; then echo "api did not report Redis down within 1 s (last: $body)"; docker logs api-noredis; exit 1; fi
          docker run -d --name redis-late --network host redis:8 --port 6399
          for _ in $(seq 1 30); do
            body=$(curl -s -m 1 http://localhost:3002/health || true)
            case "$body" in *'"redis":"ok"'*)
              state=$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' api-noredis)
              if [ "$state" = "true 0" ]; then echo "same process picked Redis up: $body"; exit 0; fi
              echo "Redis ok, but not from the same process (running, restarts: $state)"; docker logs api-noredis; exit 1 ;;
            esac
            sleep 1
          done
          echo "api did not pick Redis up (last: $body)"; docker logs api-noredis; exit 1

  # Builds the web image without pushing it, so a Dockerfile that no longer
  # builds fails the pull request rather than the first deploy (#47, CON-3). Skipped until web/Dockerfile exists. hashFiles
  # cannot be used in a job-level condition, so each step carries it; the job itself
  # always runs and reports green. The cache has its own scope so the two
  # images do not overwrite each other's layers.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Skipped
        if: hashFiles('web/Dockerfile') == ''
        run: echo "web/Dockerfile does not exist yet (#47), web image build skipped"
      - uses: docker/setup-buildx-action@v3
        if: hashFiles('web/Dockerfile') != ''
      - uses: docker/build-push-action@v6
        if: hashFiles('web/Dockerfile') != ''
        with:
          context: web # the Dockerfile and its files live in web/
          push: false # build only; nothing is published from a pull request
          load: true # keep the result in the runner's Docker daemon
          tags: contentcollab-web:pr # local tag, never published
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
