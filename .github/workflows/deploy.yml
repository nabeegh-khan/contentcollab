# Runs on every merge to main (#70, proposal section 2.7):
# 1. the same checks as every pull request (ci.yml), so nothing untested ships;
# 2. builds the api and worker images and pushes them to the GitHub Container
#    Registry, tagged with the commit SHA (INF-5, INF-9);
# 3. once the DIGITALOCEAN_ACCESS_TOKEN secret exists, pins both Deployments to
#    that SHA, applies the overlay once and undoes any Deployment whose rollout
#    never turns ready (INF-9); then, once the SMOKE_URL variable is
#    set, checks /health and undoes both if it does not answer ok (L8 p53-55).
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "worker/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"

# Package names on ghcr.io must be lowercase; the repository name is not
env:
  REGISTRY: ghcr.io/nabeegh-khan

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io, no extra secret
    strategy:
      matrix:
        service: [api, worker] # one image per service folder, built in parallel
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          # Two tags: the SHA for rollouts and rollbacks, latest for laptops
          tags: |
            ${{ env.REGISTRY }}/contentcollab-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/contentcollab-${{ matrix.service }}:latest
          # Reuses layers from the last build so the npm ci layer is cached
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  rollout:
    needs: build
    runs-on: ubuntu-latest
    # One rollout at a time. A merge waits for the running one; a newer merge
    # replaces a rollout still waiting, so usually the newest commit deploys
    # (GitHub does not guarantee the order in which waiting runs start)
    concurrency:
      group: rollout
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      # Until the secret exists the job stops here, green
      - name: Check for a cluster
        id: cluster
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          if [ -z "$DO_TOKEN" ]; then
            msg="No DIGITALOCEAN_ACCESS_TOKEN secret: images pushed, cluster not changed"
            echo "::warning title=No rollout::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            [ -n "$SMOKE_URL" ] || echo "::warning title=No smoke check::SMOKE_URL is not set, so a release that starts but does not serve is not rolled back"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # DigitalOcean's documented pattern: doctl from the official action and a
      # kubeconfig whose credentials expire after ten minutes, so no long-lived
      # cluster credential is stored in GitHub (docs.digitalocean.com, "How to
      # Enable Push-to-Deploy on DigitalOcean Kubernetes Using GitHub Actions")
      - uses: digitalocean/action-doctl@v2
        if: steps.cluster.outputs.present == 'true'
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - uses: azure/setup-kubectl@v4
        if: steps.cluster.outputs.present == 'true'

      - name: Short-lived cluster credentials
        if: steps.cluster.outputs.present == 'true'
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 contentcollab
      - name: Run database migration and roll out Deployments

        if: steps.cluster.outputs.present == 'true'
        run: |

          set -e

          # Apply infrastructure without deploying API or worker
          kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/doks/infra | kubectl apply -f -

          # Wait for PostgreSQL
          kubectl -n contentcollab rollout status statefulset/postgres --timeout=180s

          # Run database migration for this commit
          JOB_NAME="db-migrate-${GITHUB_SHA}"
          sed "s/__IMAGE_TAG__/${GITHUB_SHA}/g" k8s/doks/migrate-job.yaml | kubectl apply -f -

          kubectl -n contentcollab wait \
            --for=condition=complete \
            "job/${JOB_NAME}" \
            --timeout=180s

          # Deploy API and worker with commit-specific images
          kubectl kustomize k8s/doks \
            | sed \
                -e "s|ghcr.io/nabeegh-khan/contentcollab-api:latest|ghcr.io/nabeegh-khan/contentcollab-api:${GITHUB_SHA}|g" \
                -e "s|ghcr.io/nabeegh-khan/contentcollab-worker:latest|ghcr.io/nabeegh-khan/contentcollab-worker:${GITHUB_SHA}|g" \
            | kubectl apply -f -

          # Verify deployments and roll back failures
          failed=0
          for svc in api worker; do
            image=$(kubectl -n contentcollab get deployment/$svc -o jsonpath='{.spec.template.spec.containers[0].image}') \
              || image="(unreadable)"

            case "$image" in
              *:${GITHUB_SHA}) ;;
              *)
                echo "::error::deployment/$svc runs $image, not this commit"
                failed=1
                continue
                ;;
            esac

            kubectl -n contentcollab rollout status deployment/$svc --timeout=180s \
              || {
                kubectl -n contentcollab rollout undo deployment/$svc \
                  || echo "::error::undo of deployment/$svc failed: the cluster may run mixed versions"
                failed=1
              }
          done
          exit $failed

      # Smoke test and roll back both Deployments if health check fails
      - name: Smoke check, roll back on failure
        if: steps.cluster.outputs.present == 'true' && vars.SMOKE_URL != ''
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          for _ in $(seq 1 12); do
            body=$(curl -sS --max-time 5 "$SMOKE_URL/health" || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "smoke ok: $body"
              exit 0
            fi
            sleep 5
          done

          echo "::error::Smoke check failed (last body: $body): rolling back"

          doctl kubernetes cluster kubeconfig save --expiry-seconds 600 contentcollab \
            || echo "::warning::could not refresh credentials; trying rollback with current credentials"

          for svc in api worker; do
            {
              kubectl -n contentcollab rollout undo deployment/$svc \
                && kubectl -n contentcollab rollout status deployment/$svc --timeout=180s
            } || echo "::error::rollback of deployment/$svc failed: the cluster may run mixed versions"
          done

          exit 1
