# Runs on every merge to main. Builds the API image, tags it with the commit
# SHA and pushes it to the GitHub Container Registry; then, once the cluster
# exists and KUBECONFIG is set as a repository secret, rolls the api
# Deployment to that tag and waits for it to finish (proposal section 2.7).
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "worker/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"

# Package names on ghcr.io must be lowercase; the repository name is not
env:
  REGISTRY: ghcr.io/nabeegh-khan

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io, no extra secret
    strategy:
      matrix:
        service: [api, worker] # one image per service folder, built in parallel
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          # Two tags: the SHA for rollouts and rollbacks, latest for laptops
          tags: |
            ${{ env.REGISTRY }}/contentcollab-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/contentcollab-${{ matrix.service }}:latest
          # Reuses layers from the last build so the npm ci layer is cached
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  rollout:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Until stage 3 the secret is empty and the job stops here, green
      - name: Check for a cluster
        id: cluster
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "No KUBECONFIG secret: image pushed, no rollout"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: azure/setup-kubectl@v4
        if: steps.cluster.outputs.present == 'true'
      - name: Roll the Deployments to this commit
        if: steps.cluster.outputs.present == 'true'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl apply -k k8s/doks
          for svc in api worker; do
            kubectl -n contentcollab set image deployment/$svc $svc=$REGISTRY/contentcollab-$svc:${{ github.sha }}
          done
          # Fails the job, and so the run, if the new pods never become ready
          kubectl -n contentcollab rollout status deployment/api --timeout=180s
          kubectl -n contentcollab rollout status deployment/worker --timeout=180s
