# Runs on every merge to main (#70, proposal section 2.7):
# 1. the same checks as every pull request (ci.yml), so nothing untested ships;
# 2. builds the api and worker images and pushes them to the GitHub Container
#    Registry, tagged with the commit SHA (INF-5, INF-9);
# 3. once the DIGITALOCEAN_ACCESS_TOKEN secret exists, pins both Deployments to
#    that SHA, applies the overlay once and undoes any Deployment whose rollout
#    never turns ready (INF-9); then, once the SMOKE_URL variable is
#    set, checks /health and undoes both if it does not answer ok (L8 p53-55).
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "worker/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"

# Package names on ghcr.io must be lowercase; the repository name is not
env:
  REGISTRY: ghcr.io/nabeegh-khan

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io, no extra secret
    strategy:
      matrix:
        service: [api, worker] # one image per service folder, built in parallel
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          # Two tags: the SHA for rollouts and rollbacks, latest for laptops
          tags: |
            ${{ env.REGISTRY }}/contentcollab-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/contentcollab-${{ matrix.service }}:latest
          # Reuses layers from the last build so the npm ci layer is cached
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  rollout:
    needs: build
    runs-on: ubuntu-latest
    # One rollout at a time. A merge waits for the running one; a newer merge
    # replaces a rollout still waiting, so usually the newest commit deploys
    # (GitHub does not guarantee the order in which waiting runs start)
    concurrency:
      group: rollout
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      # Until the secret exists the job stops here, green
      - name: Check for a cluster
        id: cluster
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          if [ -z "$DO_TOKEN" ]; then
            msg="No DIGITALOCEAN_ACCESS_TOKEN secret: images pushed, cluster not changed"
            echo "::warning title=No rollout::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            [ -n "$SMOKE_URL" ] || echo "::warning title=No smoke check::SMOKE_URL is not set, so a release that starts but does not serve is not rolled back"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # DigitalOcean's documented pattern: doctl from the official action and a
      # kubeconfig whose credentials expire after ten minutes, so no long-lived
      # cluster credential is stored in GitHub (docs.digitalocean.com, "How to
      # Enable Push-to-Deploy on DigitalOcean Kubernetes Using GitHub Actions")
      - uses: digitalocean/action-doctl@v2
        if: steps.cluster.outputs.present == 'true'
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - uses: azure/setup-kubectl@v4
        if: steps.cluster.outputs.present == 'true'
      - name: Roll the Deployments to this commit
        if: steps.cluster.outputs.present == 'true'
        run: |
          kubectl apply -k k8s/doks
          for svc in api worker; do
            kubectl -n contentcollab set image deployment/$svc $svc=$REGISTRY/contentcollab-$svc:${{ github.sha }}
          done
          # Fails the job, and so the run, if the new pods never become ready
          kubectl -n contentcollab rollout status deployment/api --timeout=180s
          kubectl -n contentcollab rollout status deployment/worker --timeout=180s
