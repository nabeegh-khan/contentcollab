# Runs on every merge to main (#70, proposal section 2.7):
# 1. the same checks as every pull request (ci.yml), so nothing untested ships;
# 2. builds the api, worker and web images and pushes them to the GitHub Container
#    Registry, tagged with the commit SHA (INF-5, INF-9);
# 3. once the DIGITALOCEAN_ACCESS_TOKEN secret exists, pins the three Deployments to
#    that SHA, applies the overlay once and undoes any Deployment whose rollout
#    never turns ready (INF-9); then, once the SMOKE_URL variable is
#    set, checks /health and undoes all three if it does not answer ok (L8 p53-55).
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "worker/**"
      - "web/**"
      - "k8s/**"
      - "functions/**"
      - ".github/workflows/deploy.yml"
      # Last, so it removes markdown matched above: a README-only change does
      # not deploy, a change that also touches code does (#108, D25)
      - "!**/*.md"

# Package names on ghcr.io must be lowercase; the repository name is not
env:
  REGISTRY: ghcr.io/nabeegh-khan

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io, no extra secret
    strategy:
      matrix:
        service: [api, worker, web] # one image per service folder, built in parallel
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          # Two tags: the SHA for rollouts and rollbacks, latest for laptops
          tags: |
            ${{ env.REGISTRY }}/contentcollab-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/contentcollab-${{ matrix.service }}:latest
          # Reuses layers from the last build so the npm ci layer is cached
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  rollout:
    needs: build
    runs-on: ubuntu-latest
    # One rollout at a time. A merge waits for the running one; a newer merge
    # replaces a rollout still waiting, so usually the newest commit deploys
    # (GitHub does not guarantee the order in which waiting runs start)
    concurrency:
      group: rollout
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      # Until the secret exists the job stops here, green
      - name: Check for a cluster
        id: cluster
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          if [ -z "$DO_TOKEN" ]; then
            msg="No DIGITALOCEAN_ACCESS_TOKEN secret: images pushed, cluster not changed"
            echo "::warning title=No rollout::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            [ -n "$SMOKE_URL" ] || echo "::warning title=No smoke check::SMOKE_URL is not set, so a release that starts but does not serve is not rolled back"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # DigitalOcean's documented pattern: doctl from the official action and a
      # kubeconfig whose credentials expire after ten minutes, so no long-lived
      # cluster credential is stored in GitHub (docs.digitalocean.com, "How to
      # Enable Push-to-Deploy on DigitalOcean Kubernetes Using GitHub Actions")
      - uses: digitalocean/action-doctl@v2
        if: steps.cluster.outputs.present == 'true'
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - uses: azure/setup-kubectl@v4
        if: steps.cluster.outputs.present == 'true'
      - name: Short-lived cluster credentials
        if: steps.cluster.outputs.present == 'true'
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 contentcollab
      # The schema moves before any pod does (ARCHITECTURE D20, #117). A
      # failed migration fails this step, so the rollout below is skipped and
      # the old pods keep serving on the old schema. Each migration must keep
      # the previous API version working while both run (#105, L7 p17)
      - name: Migrate the database to this commit
        if: steps.cluster.outputs.present == 'true'
        run: |
          if [ ! -d api/migrations ]; then echo "No api/migrations in this commit: nothing to migrate"; exit 0; fi
          # A re-run of the same commit finds its earlier Job; a Job's pod
          # template cannot be changed, so it is replaced, not re-applied
          kubectl -n contentcollab delete job "db-migrate-${{ github.sha }}" --ignore-not-found --wait=true
          sed "s/__IMAGE_TAG__/${{ github.sha }}/g" k8s/doks/migrate-job.yaml | kubectl apply -f -
          # 150 s here plus three 120 s rollouts stays inside the 600 s login (D27)
          # (the Job itself stops at 120 s, activeDeadlineSeconds)
          if ! kubectl -n contentcollab wait --for=condition=complete "job/db-migrate-${{ github.sha }}" --timeout=150s; then
            echo "::error::migration Job db-migrate-${{ github.sha }} did not complete: no rollout"
            kubectl -n contentcollab logs "job/db-migrate-${{ github.sha }}" --tail=100 || true
            # At the deadline the pod is terminated, and a pod that never
            # started has no log. The Job's status says that it stopped; the
            # pod's own events (image pull, missing key) say why, and they
            # outlive the pod
            kubectl -n contentcollab describe "job/db-migrate-${{ github.sha }}" || true
            kubectl -n contentcollab get events --field-selector involvedObject.kind=Pod --sort-by=.lastTimestamp | grep "db-migrate-${{ github.sha }}" || true
            exit 1
          fi
      - name: Roll the Deployments to this commit
        if: steps.cluster.outputs.present == 'true'
        run: |
          # Pin every image to this commit in the overlay, then apply once:
          # one rollout per merge, and the manifest that is applied names the
          # image that was built (INF-9)
          cd k8s/doks
          for svc in api worker web; do
            kustomize edit set image $REGISTRY/contentcollab-$svc=$REGISTRY/contentcollab-$svc:${{ github.sha }}
          done
          cd ../..
          # Each Deployment's revision before the apply. A Deployment counts as
          # changed by this run only if its revision moves, so a re-run of the
          # same commit (no new revision) never undoes past what is running.
          # The smoke step reads the same values (D25, #108)
          for svc in api worker web; do
            # Empty when there is no Deployment yet (--ignore-not-found), so
            # anything after the apply is new; "unreadable" on any other error
            rev=$(kubectl -n contentcollab get deployment/$svc --ignore-not-found -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}') \
              || rev="unreadable"
            printf -v "before_$svc" '%s' "$rev"
            echo "REV_BEFORE_$svc=$rev" >> "$GITHUB_ENV"
          done
          # changed, same, or unreadable (an API error or an expired login,
          # before or after the apply: whether this run changed it is then
          # unknown, so it is not undone blind, and the run says so)
          revision_state() {
            local now before="before_$1"
            now=$(kubectl -n contentcollab get deployment/$1 -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}') || now=""
            if [ -z "$now" ] || [ "${!before}" = unreadable ]; then echo unreadable
            elif [ "$now" != "${!before}" ]; then echo changed
            else echo same
            fi
          }
          undone=" "
          undo() {
            undone="$undone$1 "
            kubectl -n contentcollab rollout undo deployment/$1 \
              || echo "::error::undo of deployment/$1 failed: the cluster may run mixed versions"
          }
          # $2 is "watch" (the Deployment that failed) or "final" (the others,
          # after the login is renewed). An unreadable one is tried again in
          # the final pass; a healthy one this run left alone is not an error
          undo_if_changed() {
            case "$(revision_state $1)" in
              changed) undo $1 ;;
              same) [ "$2" = watch ] && echo "::error::deployment/$1 was not changed by this run (a re-run of the same commit?): not undone" ;;
              *) if [ "$2" = watch ]; then echo "::warning::deployment/$1: revision unreadable; tried again after renewing the login"
                 else echo "::error::deployment/$1: its revision is unreadable, so whether this run changed it is unknown: not undone; check it by hand"
                 fi ;;
            esac
            return 0
          }
          failed=0
          # An apply that fails partway may already have started rollouts:
          # report it and still watch them, rather than ending the step here
          kubectl apply -k k8s/doks \
            || { echo "::error::kubectl apply failed partway: still watching, and undoing what this run changed"; failed=1; }
          # A rollout that never turns ready is rolled back here, not by hand,
          # and the job still fails so the run is not green (INF-9). A failed
          # undo is reported and the next Deployment is still checked.
          for svc in api worker web; do
            # A renamed image would leave set image matching nothing, so the
            # apply sets the base placeholder `unpinned`, which cannot be
            # pulled: that rollout never finishes (the old pods keep serving).
            # It fails the run and goes on to the watch below, whose `rollout
            # status` waits for the new revision before undoing it; an undo
            # straight after the apply could go back one revision too far.
            # Any other image is reported without an undo, since no new
            # revision may exist to undo
            image=$(kubectl -n contentcollab get deployment/$svc -o jsonpath='{.spec.template.spec.containers[0].image}') \
              || image="(unreadable)"   # a bare failing assignment would end the step under bash -e
            case "$image" in
              *:${{ github.sha }}) ;;
              *:unpinned) echo "::error::deployment/$svc was applied with the placeholder tag"; failed=1 ;;
              *) echo "::error::deployment/$svc runs $image, not this commit"; failed=1; continue ;;
            esac
            # 120 s each: three waits after a 150 s migration fit the 600 s
            # login; rolling two Deployments took 30 s on 18 Nov (D27)
            if ! kubectl -n contentcollab rollout status deployment/$svc --timeout=120s; then
              failed=1
              echo "::error::deployment/$svc did not turn ready"
              undo_if_changed $svc watch
            fi
          done
          # One failure undoes every Deployment this run changed, so the
          # cluster is not left running Deployments from different commits.
          # This can come after the migration and three waits (up to 510 s), so
          # the ten-minute login is renewed first, as in the smoke step
          if [ "$failed" = 1 ]; then
            doctl kubernetes cluster kubeconfig save --expiry-seconds 600 contentcollab \
              || echo "::warning::could not renew the cluster login; trying the undo with the current one"
            for svc in api worker web; do
              case "$undone" in *" $svc "*) continue ;; esac
              undo_if_changed $svc final
            done
          fi
          exit $failed
      # Skipped until SMOKE_URL is set, so deploys do not roll back before DNS
      # and TLS exist
      - name: Smoke check, roll back on failure
        if: steps.cluster.outputs.present == 'true' && vars.SMOKE_URL != ''
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          # Reads the body, not just the status: both dependencies must be up.
          # No -f, so a 503's body (which dependency is down) reaches the log
          for _ in $(seq 1 12); do
            body=$(curl -sS --max-time 5 "$SMOKE_URL/health" || true)
            if echo "$body" | grep -q '"status":"ok"'; then echo "smoke ok: $body"; exit 0; fi
            sleep 5
          done
          echo "::error::Smoke check failed (last body: $body): rolling back"
          # The ten-minute credentials may have run out during the rollouts and
          # the smoke wait; fetch fresh ones so the rollback is not refused
          doctl kubernetes cluster kubeconfig save --expiry-seconds 600 contentcollab \
            || echo "::warning::could not refresh cluster credentials; trying the rollback with the current ones"
          # Every Deployment this run changed goes back, together; one that it
          # did not change (a re-run of the same commit) is reported, since an
          # undo would go back past what is running. One failed undo does not
          # stop the other (D25, #108)
          for svc in api worker web; do
            before="REV_BEFORE_$svc"
            now=$(kubectl -n contentcollab get deployment/$svc -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}') || now=""
            if [ -z "$now" ] || [ "${!before}" = unreadable ]; then
              echo "::error::deployment/$svc: its revision is unreadable, so whether this run changed it is unknown: not undone; check it by hand"
              continue
            elif [ "$now" = "${!before}" ]; then
              echo "::error::deployment/$svc was not changed by this run (a re-run of the same commit?): not undone"
              continue
            fi
            { kubectl -n contentcollab rollout undo deployment/$svc \
                && kubectl -n contentcollab rollout status deployment/$svc --timeout=120s; } \
              || echo "::error::rollback of deployment/$svc failed: the cluster may run mixed versions"
          done
          exit 1

  # Deploys functions/ (the compare function, D39, #180) on every merge that touches it or the code it
  # shares a trigger with. Independent of the cluster rollout: no cluster login. Until its inputs exist the
  # job stops green with a warning, as the rollout does without a cluster token
  functions:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read # reads the repo, writes nothing
    # One deploy at a time; a later merge waits rather than racing the running one
    concurrency:
      group: functions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Check for Functions inputs
        id: functions
        env:
          API_TOKEN: ${{ secrets.DO_FUNCTIONS_TOKEN || secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AUTH_VALUE: ${{ secrets.FUNCTION_AUTH_TOKEN }}
          NAMESPACE: ${{ vars.FUNCTIONS_NAMESPACE }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$AUTH_VALUE" ] || [ -z "$NAMESPACE" ]; then
            msg="Functions deploy skipped: needs the secret FUNCTION_AUTH_TOKEN, the variable FUNCTIONS_NAMESPACE and a DigitalOcean API token with function:admin (DO_FUNCTIONS_TOKEN, or DIGITALOCEAN_ACCESS_TOKEN)"
            echo "::warning title=No Functions deploy::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: digitalocean/action-doctl@v2
        if: steps.functions.outputs.present == 'true'
        with:
          token: ${{ secrets.DO_FUNCTIONS_TOKEN || secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Connect to the Functions namespace
        if: steps.functions.outputs.present == 'true'
        env:
          NAMESPACE: ${{ vars.FUNCTIONS_NAMESPACE }}
        run: |
          doctl serverless install
          doctl serverless connect "$NAMESPACE"
      - name: Deploy functions/
        if: steps.functions.outputs.present == 'true'
        env:
          AUTH_VALUE: ${{ secrets.FUNCTION_AUTH_TOKEN }}
        run: |
          # The shared value reaches project.yml through an env file outside the checkout, removed after
          # the deploy; it is never printed (project.yml reads ${FUNCTION_AUTH_TOKEN})
          vars_file="$RUNNER_TEMP/functions.vars"
          printf 'FUNCTION_AUTH_TOKEN=%s\n' "$AUTH_VALUE" > "$vars_file"
          trap 'rm -f "$vars_file"' EXIT
          doctl serverless deploy functions --env "$vars_file"
      - name: Show the deployed function
        if: steps.functions.outputs.present == 'true'
        run: doctl serverless functions get compare/diff --url
