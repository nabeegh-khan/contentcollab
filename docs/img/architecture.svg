<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
<title>ContentCollab architecture: browser, Gateway, web, api, worker, Redis, PostgreSQL, Spaces, monitoring and CI/CD</title>
<!--
  Full architecture diagram, checked against main (k8s/, .github/workflows/) on 23 Nov 2026.
  Hand-editable: one <g id="..."> per box, boxes first, arrows last. Text sizes: names 22, everything else 20
  (a 1600-wide slide image shown 13.33 in wide gives 12 pt for 20 and 13 pt for 22).
  Colours: orange = traffic entry, green = application, blue = state, purple = monitoring, grey = outside the cluster.
  The one-slide version is architecture-slide.svg.
-->
<defs>
  <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#333"/></marker>
  <style>
    .n { font-size: 22px; font-weight: 700; fill: #1a1a1a; text-anchor: middle; }
    .d { font-size: 20px; fill: #2b2b2b; text-anchor: middle; }
    .t { font-size: 20px; font-weight: 700; }
    .l { font-size: 20px; fill: #222; text-anchor: middle; }
    .ls { font-size: 20px; fill: #222; text-anchor: start; }
    .le { font-size: 20px; fill: #222; text-anchor: end; }
    .pill { font-size: 20px; font-weight: 700; fill: #8a5a12; text-anchor: middle; }
    .a { fill: none; stroke: #333; stroke-width: 2.5; }
    .dash { stroke-dasharray: 8 6; }
    .bg { fill: #fff; }
  </style>
</defs>
<rect width="1600" height="900" fill="#fff"/>

<!-- Legend -->
<g id="legend">
  <path d="M20,40 L62,40" class="a" marker-end="url(#arr)"/>
  <text x="72" y="47" class="ls">traffic and data</text>
  <path d="M20,76 L62,76" class="a dash" marker-end="url(#arr)"/>
  <text x="72" y="83" class="ls">deploy, monitoring</text>
</g>

<!-- Outside the cluster: user, CI/CD, storage -->
<g id="browser">
  <rect x="20" y="205" width="200" height="80" rx="8" fill="#eef2f7" stroke="#5b6b80" stroke-width="2.5"/>
  <text x="120" y="239" class="n">Browser</text>
  <text x="120" y="267" class="d">React web app</text>
</g>
<g id="github-actions">
  <rect x="290" y="15" width="330" height="105" rx="8" fill="#f3f3f3" stroke="#777" stroke-width="2.5"/>
  <text x="455" y="49" class="n">GitHub Actions</text>
  <text x="455" y="77" class="d">tests must pass first</text>
  <text x="455" y="103" class="d">build, migrate, roll out</text>
</g>
<g id="ghcr">
  <rect x="700" y="15" width="270" height="80" rx="8" fill="#f3f3f3" stroke="#777" stroke-width="2.5"/>
  <text x="835" y="49" class="n">GHCR</text>
  <text x="835" y="77" class="d">images tagged by commit</text>
</g>
<g id="spaces">
  <path d="M1370,494 a110,14 0 0 1 220,0 v142 a110,14 0 0 1 -220,0 z" fill="#f3f3f3" stroke="#777" stroke-width="2.5"/>
  <ellipse cx="1480" cy="494" rx="110" ry="14" fill="#f3f3f3" stroke="#777" stroke-width="2.5"/>
  <text x="1480" y="548" class="n">Spaces</text>
  <text x="1480" y="576" class="d">uploaded files</text>
  <text x="1480" y="604" class="d">database backups</text>
</g>

<!-- The cluster -->
<g id="cluster">
  <rect x="270" y="150" width="1070" height="740" rx="12" fill="#fcfcfc" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1325" y="178" class="t le" fill="#555">DigitalOcean Kubernetes · New York (nyc3)</text>
</g>

<!-- Traffic entry -->
<g id="load-balancer">
  <rect x="290" y="205" width="230" height="80" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="2.5"/>
  <text x="405" y="239" class="n">Load balancer</text>
  <text x="405" y="267" class="d">DigitalOcean service</text>
</g>
<g id="gateway">
  <rect x="290" y="335" width="230" height="105" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="2.5"/>
  <text x="405" y="369" class="n">Gateway</text>
  <text x="405" y="397" class="d">NGINX Gateway Fabric</text>
  <text x="405" y="423" class="d">HTTPS, routes by path</text>
</g>
<g id="cert-manager">
  <rect x="290" y="500" width="165" height="80" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="2.5"/>
  <text x="372" y="534" class="n">cert-manager</text>
  <text x="372" y="562" class="d">Let's Encrypt</text>
</g>

<!-- Application namespace -->
<g id="ns-contentcollab">
  <rect x="670" y="195" width="650" height="520" rx="12" fill="none" stroke="#3f7d4e" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="690" y="225" class="t" fill="#3f7d4e">Namespace contentcollab</text>
</g>
<g id="web">
  <rect x="690" y="250" width="230" height="105" rx="8" fill="#e8f3ea" stroke="#3f7d4e" stroke-width="2.5"/>
  <text x="805" y="284" class="n">web · 2 pods</text>
  <text x="805" y="312" class="d">nginx, uid 101</text>
  <text x="805" y="338" class="d">operations panel</text>
</g>
<g id="api">
  <rect x="690" y="395" width="230" height="130" rx="8" fill="#e8f3ea" stroke="#3f7d4e" stroke-width="2.5"/>
  <text x="805" y="440" class="n">api · 2 to 5 pods</text>
  <text x="805" y="470" class="d">autoscaled on CPU</text>
  <text x="805" y="498" class="d">JWT sign-in, roles</text>
</g>
<g id="worker">
  <rect x="1070" y="250" width="230" height="80" rx="8" fill="#e8f3ea" stroke="#3f7d4e" stroke-width="2.5"/>
  <text x="1185" y="284" class="n">worker · 1 pod</text>
  <text x="1185" y="312" class="d">BullMQ jobs</text>
</g>
<g id="redis">
  <rect x="1070" y="395" width="230" height="90" rx="8" fill="#e9eefb" stroke="#3d5bb8" stroke-width="2.5"/>
  <text x="1185" y="430" class="n">Redis · 1 pod</text>
  <text x="1185" y="460" class="d">live events, job queue</text>
</g>
<g id="postgres">
  <path d="M690,584 a115,14 0 0 1 230,0 v102 a115,14 0 0 1 -230,0 z" fill="#e9eefb" stroke="#3d5bb8" stroke-width="2.5"/>
  <ellipse cx="805" cy="584" rx="115" ry="14" fill="#e9eefb" stroke="#3d5bb8" stroke-width="2.5"/>
  <text x="805" y="620" class="n">PostgreSQL</text>
  <text x="805" y="647" class="d">StatefulSet</text>
  <text x="805" y="673" class="d">5 GiB volume</text>
</g>
<g id="db-backup">
  <rect x="1070" y="570" width="230" height="105" rx="8" fill="#e9eefb" stroke="#3d5bb8" stroke-width="2.5"/>
  <text x="1185" y="604" class="n">db-backup</text>
  <text x="1185" y="632" class="d">CronJob, nightly 03:00</text>
  <text x="1185" y="658" class="d">pg_dump to Spaces</text>
</g>

<!-- Observability namespace -->
<g id="ns-observability">
  <rect x="290" y="735" width="805" height="140" rx="12" fill="none" stroke="#7a4fb0" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1080" y="763" class="t le" fill="#7a4fb0">Namespace observability</text>
</g>
<g id="grafana">
  <rect x="315" y="780" width="210" height="80" rx="8" fill="#f1ebf9" stroke="#7a4fb0" stroke-width="2.5"/>
  <text x="420" y="814" class="n">Grafana</text>
  <text x="420" y="842" class="d">dashboards</text>
</g>
<g id="prometheus">
  <rect x="575" y="780" width="210" height="80" rx="8" fill="#f1ebf9" stroke="#7a4fb0" stroke-width="2.5"/>
  <text x="680" y="814" class="n">Prometheus</text>
  <text x="680" y="842" class="d">metrics store</text>
</g>
<g id="kube-state-metrics">
  <rect x="835" y="780" width="240" height="80" rx="8" fill="#f1ebf9" stroke="#7a4fb0" stroke-width="2.5"/>
  <text x="955" y="814" class="n">kube-state-metrics</text>
  <text x="955" y="842" class="d">pod and HPA state</text>
</g>

<!-- Arrows: traffic and data (solid) -->
<g id="arrows-traffic">
  <path d="M220,245 L290,245" class="a" marker-end="url(#arr)"/>
  <path d="M405,285 L405,335" class="a" marker-end="url(#arr)"/>
  <path d="M520,360 L580,360 L580,290 L690,290" class="a" marker-end="url(#arr)"/>
  <path d="M520,420 L690,420" class="a" marker-end="url(#arr)"/>
  <path d="M490,440 L490,780" class="a" marker-end="url(#arr)"/>
  <path d="M920,440 L1070,440" class="a" marker-end="url(#arr)"/>
  <path d="M1110,330 L1110,395" class="a" marker-end="url(#arr)"/>
  <path d="M805,525 L805,584" class="a" marker-end="url(#arr)"/>
  <path d="M1070,615 L920,615" class="a" marker-end="url(#arr)"/>
  <path d="M920,508 L1370,508" class="a" marker-end="url(#arr)"/>
  <path d="M1300,615 L1370,615" class="a" marker-end="url(#arr)"/>
  <path d="M525,820 L575,820" class="a dash" marker-end="url(#arr)"/>
  <path d="M785,820 L835,820" class="a dash" marker-end="url(#arr)"/>
</g>
<!-- Arrows: certificates, deploy, monitoring (dashed) -->
<g id="arrows-dashed">
  <path d="M340,500 L340,440" class="a dash" marker-end="url(#arr)"/>
  <path d="M620,780 L620,490 L690,490" class="a dash" marker-end="url(#arr)"/>
  <path d="M620,62 L700,62" class="a dash" marker-end="url(#arr)"/>
  <path d="M560,120 L560,172 L700,172 L700,195" class="a dash" marker-end="url(#arr)"/>
  <path d="M830,195 L830,95" class="a dash" marker-end="url(#arr)"/>
</g>

<!-- Arrow labels (white backing so lines do not run through the text) -->
<g id="labels">
  <rect class="bg" x="220" y="214" width="70" height="27"/><text x="255" y="235" class="l">HTTPS</text>
  <rect class="bg" x="342" y="454" width="128" height="27"/><text x="354" y="475" class="ls">certificate</text>
  <rect class="bg" x="591" y="259" width="70" height="27"/><text x="626" y="280" class="l">pages</text>
  <rect class="bg" x="517" y="389" width="174" height="27"/><text x="604" y="410" class="l">/api, /socket.io</text>
  <rect class="bg" x="492" y="616" width="100" height="27"/><text x="502" y="637" class="ls">/grafana</text>
  <rect class="bg" x="925" y="409" width="140" height="27"/><text x="995" y="430" class="l">live events</text>
  <rect class="bg" x="1112" y="347" width="120" height="27"/><text x="1122" y="368" class="ls">job queue</text>
  <rect class="bg" x="808" y="536" width="60" height="27"/><text x="818" y="557" class="ls">SQL</text>
  <rect class="bg" x="945" y="584" width="100" height="27"/><text x="995" y="605" class="l">pg_dump</text>
  <rect class="bg" x="1110" y="513" width="70" height="27"/><text x="1145" y="534" class="l">files</text>
  <rect class="bg" x="623" y="33" width="74" height="27"/><text x="660" y="54" class="l">push</text>
  <rect class="bg" x="300" y="121" width="260" height="27"/><text x="552" y="142" class="le">roll out, undo on failure</text>
  <rect class="bg" x="703" y="107" width="128" height="27"/><text x="822" y="128" class="le">pull images</text>
  <rect class="bg" x="535" y="680" width="86" height="27"/><text x="612" y="701" class="le">scrapes</text>
</g>

<!-- Advanced-feature tags -->
<g id="tags">
  <g id="tag-cicd"><rect x="510" y="2" width="96" height="28" rx="14" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/><text x="558" y="23" class="pill">CI/CD</text></g>
  <g id="tag-security"><rect x="418" y="322" width="108" height="28" rx="14" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/><text x="472" y="343" class="pill">Security</text></g>
  <g id="tag-autoscaling"><rect x="765" y="381" width="150" height="28" rx="14" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/><text x="840" y="402" class="pill">Auto-scaling</text></g>
  <g id="tag-realtime"><rect x="1175" y="381" width="118" height="28" rx="14" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/><text x="1234" y="402" class="pill">Real-time</text></g>
</g>
</svg>
